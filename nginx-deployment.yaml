apiVersion: apps/v1
kind: Deployment # service or deployment
metadata:
  name: demo-deployment #name for deployment
  labels:
    app: nginx #could be anything that we want
spec: # specification fro deployment
  replicas: 2
  selector: #actually connects the deployment to pods
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.29
          ports:
            - containerPort: 8080 #pod port
